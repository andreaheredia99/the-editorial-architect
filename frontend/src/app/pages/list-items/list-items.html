<h1>List items</h1>

<!-- navegación sin recargar página-->
<button routerLink="/create-item">
    Create new item
</button>


<!-- Renderizar los items reales en pantalla -->
@for (item of items(); track item.id) {

<div class="item-card">

    <h3>{{ item.title }}</h3>

    <p>{{ item.description }}</p>

    <button [routerLink]="['/detail-item', item.id]">
        See detail item
    </button>

    <button [routerLink]="['/edit-item', item.id]">
        Edit item
    </button>

    <button (click)="deleteItem(item.id)">
        Delete item
    </button>

</div>

} @empty {

<p>There are no items yet</p>

}
