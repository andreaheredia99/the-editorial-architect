<div class="container">

    <div class="page-header">

        <h1>Items</h1>

        <!-- navegación sin recargar página-->
        <button routerLink="/create-item">
            Create New Item
        </button>

    </div>

    <div class="items-grid">

        <!-- Renderizar los items reales en pantalla -->
        @for (item of items(); track item.id) {

        <div class="card item-card">

            <h3>{{ item.title }}</h3>

            <p class="item-description">{{ item.description }}</p>

            <div class="item-actions">

                <button class="btn-primary" [routerLink]="['/detail-item', item.id]">
                    See detail item
                </button>

                <button class="btn-primary" [routerLink]="['/edit-item', item.id]">
                    Edit item
                </button>

                <button class="btn-primary" (click)="deleteItem(item.id)">
                    Delete item
                </button>
            
            </div>

        </div>

        } @empty {

        <p>There are no items yet</p>

        }

    </div>

</div>
