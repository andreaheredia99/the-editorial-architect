<!-- comprobar si el item ya existe-->
@if (item()){

<div class="auth-container">
    
    <div class="card detail-card">

        <!-- !, le indicamos a TypeScript que aqui no es null, ya comprobamos antes en item() -->
        <h2 class="auth-title">{{ item()!.title }}</h2>

        <p class="detail-description">{{ item()!.description }}</p>

        <div class="detail-actions">

            <button class="btn-primary" [routerLink]="['/items']">
                Return to Items
            </button>

            @if(isOwner()){
                <button  class="btn-primary" [routerLink]="['/edit-item', item()!.id]">
                    Edit Item
                </button>

                <button class="btn-primary" (click)="deleteItem()">
                    Delete Item
                </button>

            }
            
        </div>

    </div>

</div>

}
