<!-- comprobar si el item ya existe-->
@if (item()){

<div class="container detail-container">
    
    <div class="card detail-card">

        <div class="article-header">
        
            <span class="article-category">{{ item()!.category }}</span>
        
            <!-- !, le indicamos a TypeScript que aqui no es null, ya comprobamos antes en item() -->
            <h1>{{ item()!.title }}</h1>
        
            <p class="detail-description">
                {{ item()!.description }}
            </p>
        
        </div>

        <div class="article-image"></div>

        <div class="detail-actions">

            <button class="btn-primary" [routerLink]="['/items']">
                Return to Items
            </button>

            @if(isOwner()){
                <button  class="btn-primary" [routerLink]="['/edit-item', item()!.id]">
                    Edit Item
                </button>

                <button class="btn-primary" (click)="deleteItem()">
                    Delete Item
                </button>

            }
            
        </div>

    </div>

</div>

}
