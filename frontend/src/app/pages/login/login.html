<div class="login-container">
<!-- centra login en pantalla, contenedor exterior -->

    <div class="card login-card">

        <h2>Welcome Back</h2>

        <p class="subtitle">Sign in to continue</p>

        <input class="input" type="email" placeholder="Email" (input)="onEmailInput($event)" />

        <input class="input" type="password" placeholder="Password" (input)="onPasswordInput($event)" />

        <button class="btn-primary"
        (click)="onLogin()"
        [disabled]="loading()"> 
        <!-- deshabilita botón si loading = true -->
            @if(loading()){
                Loading...
            } @else {
                Login
            }
        </button>

        <p>
            Don´t have an account?
            <a routerLink="/register">
                Register
            </a>
        </p>

        @if (error()) {
        <p class="error-message">
            {{ error() }}
        </p>

        }
    </div>
</div>
