<div class="auth-container">
<!-- centra login en pantalla, contenedor exterior -->

    <div class="auth-logo">
        The Editorial Architect
    </div>

    <div class="card auth-card">

        <h2 class="auth-title">Welcome Back</h2>

        <p class="auth-subtitle">Sign in to continue</p>

        <div class="form-group">

            <label class="form-label">EMAIL ADDRESS</label>
            <input class="input" type="email" placeholder="editor@architect.com" (input)="onEmailInput($event)" >
            @if(emailTouched() && emailError()){
                <!-- muestra mensaje de emailError o no muestra nada (no error)-->
                <p class="error-message">{{ emailError() }}</p>
            }

            <label class="form-label">PASSWORD</label>
            <input class="input" type="password" placeholder="At least 6 characters" (input)="onPasswordInput($event)" >
            @if(passwordTouched () && passwordError()){
                <!-- existe error y el ususario tocó el campo? -->
                <p class="error-message">{{ passwordError() }}</p>
            }

        </div>

        <button class="btn-primary"
        (click)="onLogin()"
        [disabled]="loading() || !isFormValid()"> 
        <!-- deshabilita botón si loading = true, feedback usuario  -->
        <!-- deshabilita botón si el formulario no es válido -->
            @if(loading()){
                Logging in...
            } @else {
                Login
            }
        </button>

        <p class="form-footer">
            Don´t have an account?
            <a routerLink="/register">
                Register
            </a>
        </p>

        @if (error()) {
        <p class="error-message">
            {{ error() }}
        </p>

        }
    </div>
</div>
