<h2>Login</h2>

<input type="email" placeholder="Email" (input)="onEmailInput($event)" />

<input type="password" placeholder="Password" (input)="onPasswordInput($event)" />

<button 
(click)="onLogin()"
[disabled]="loading()"
> <!-- deshabilita botón si loading = true -->
    @if(loading()){
        Loading...
    } @else {
        Login
    }
</button>

<p>
    Don´t have an account?
    <a routerLink="/register">
        Register
    </a>
</p>

@if (error()) {
<p style="color:red;">{{ error() }}</p>

}
