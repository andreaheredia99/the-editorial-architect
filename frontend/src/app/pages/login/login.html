<div class="auth-container">
<!-- centra login en pantalla, contenedor exterior -->

    <div class="auth-logo">
        The Editorial Architect
    </div>

    <div class="card auth-card">

        <h2 class="auth-title">Welcome Back</h2>

        <p class="auth-subtitle">Sign in to continue</p>

        <div class="form-group">

            <label class="form-label">EMAIL ADDRESS</label>
            <input class="input" type="email" placeholder="editor@architect.com" (input)="onEmailInput($event)" />

            <label class="form-label">PASSWORD</label>
            <input class="input" type="password" placeholder="Enter your password" (input)="onPasswordInput($event)" />

        </div>

        <button class="btn-primary"
        (click)="onLogin()"
        [disabled]="loading()"> 
        <!-- deshabilita botón si loading = true -->
            @if(loading()){
                Loading...
            } @else {
                Login
            }
        </button>

        <p class="form-footer">
            Don´t have an account?
            <a routerLink="/register">
                Register
            </a>
        </p>

        @if (error()) {
        <p class="error-message">
            {{ error() }}
        </p>

        }
    </div>
</div>
