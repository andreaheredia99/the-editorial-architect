<h1>Create - Edit item</h1>
<!-- título -->

<form (ngSubmit)="saveItem()">
    <!-- cuando enviamos formulario, click = saveItem() -->

    <div>

        <label>Título</label>

        <!-- mostrar valor actual signal, actualiza signal, name ="title" es obligatorio para ngModel
         (ngModelChange), actualiza signal cuando usuario escribe
         ($event), nuevo valor escrito-->
        <input type="text" [ngModel]="title()" 

    
        (ngModelChange)="title.set($event)"
        
        name="title">

    </div>

    <br>

    <div>

        <label>Descripción</label>

        <!-- valor actual, actualiza signal, name="description" es obligatorio ... -->
        <textarea [ngModel]="description()" 

        (ngModelChange)="description.set($event)"
      

        name="description"></textarea>

    </div>

    <br>

    <button type="submit">
        Create - Edit item
    </button>

</form>
