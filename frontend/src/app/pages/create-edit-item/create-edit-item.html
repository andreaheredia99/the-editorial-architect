<div class="auth-container">

    <div class="card auth-card">

        <h2 class="auth-title">

            @if(isEditMode) {
            Edit Item
            } @else {
            Create Item
            }

        </h2>

        <p class="auth-subtitle">

            @if(isEditMode) {
            Update your item information
            } @else {
            Add a new item
            }

        </p>

        <form (ngSubmit)="saveItem()">  <!-- cuando enviamos formulario, click = saveItem() -->

            <div class="form-group">

                <label class="form-label">
                    Title
                </label>

                <!-- mostrar valor actual signal, actualiza signal, name ="title" es obligatorio para ngModel
                (ngModelChange), actualiza signal cuando usuario escribe
                ($event), nuevo valor escrito-->
                <!-- activamos titleTouched -->
                <input class="input" type="text" placeholder="Enter article title" [ngModel]="title()" (ngModelChange)="title.set($event); titleTouched.set(true)" name="title">
                <!-- mostramos error title -->
                @if(titleTouched() && titleError()){
                    <p class="error-message">{{ titleError() }}</p>
                }

            </div>

            <div class="form-group">

                <label class="form-label">
                    Description
                </label>

                <!-- valor actual, actualiza signal, name="description" es obligatorio ... -->
                <textarea class="input" placeholder="Write a short description of your article" [ngModel]="description()" (ngModelChange)="description.set($event); descriptionTouched.set(true)" name="description">
                </textarea>
                @if(descriptionTouched() && descriptionError()){
                <p class="error-message">{{ descriptionError() }}</p>
                }
                <!-- contador caracteres -->
                <p class="character-count">{{ description().length }} / 500</p>
                

            </div>

            <!-- deshabilitar botón si el formualrio no es válido -->
            <button type="submit" class="btn-primary" [disabled]="loading() || !isFormValid()">

                @if(loading()){
                    @if(isEditMode) {
                        Updating...
                    } @else {
                        Creating...
                    }
                } @else {
                    @if(isEditMode) {
                        Update Item
                    } @else {
                        Create Item
                    }
                }
                

            </button>

        </form>

    </div>

</div>
