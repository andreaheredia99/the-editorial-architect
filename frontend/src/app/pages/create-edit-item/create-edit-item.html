<div class="auth-container">

    <div class="card auth-card">

        <h2 class="auth-title">

            @if(isEditMode) {
            Edit Item
            } @else {
            Create Item
            }

        </h2>

        <p class="auth-subtitle">

            @if(isEditMode) {
            Update your item information
            } @else {
            Add a new item
            }

        </p>

        <form (ngSubmit)="saveItem()">  <!-- cuando enviamos formulario, click = saveItem() -->

            <div class="form-group">

                <label class="form-label">
                    Title
                </label>

                <!-- mostrar valor actual signal, actualiza signal, name ="title" es obligatorio para ngModel
                (ngModelChange), actualiza signal cuando usuario escribe
                ($event), nuevo valor escrito-->
                <input class="input" type="text" [ngModel]="title()" (ngModelChange)="title.set($event)" name="title">

            </div>

            <div class="form-group">

                <label class="form-label">
                    Description
                </label>

                <!-- valor actual, actualiza signal, name="description" es obligatorio ... -->
                <textarea class="input" [ngModel]="description()" (ngModelChange)="description.set($event)"
                    name="description">
                </textarea>

            </div>

            <button type="submit" class="btn-primary">

                @if(isEditMode) {
                Update Item
                } @else {
                Create Item
                }

            </button>

        </form>

    </div>

</div>
