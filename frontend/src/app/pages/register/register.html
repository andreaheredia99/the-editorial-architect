<div class="auth-container">
        
    <div class="auth-logo">
        The Editorial Architect
    </div>
    
    <div class="card auth-card">
        
        <h1 class="auth-title">Create Account</h1>

        <p class="auth-subtitle">Join the community</p>

        <div class="form-group">

            <label class="form-label">EMAIL ADDRESS</label>
            <input class="input" type="email" placeholder="editor@architect.com" (input)="onEmailInput($event)">
            @if(emailTouched() && emailError()){
            <!-- muestra mensaje de emailError o no muestra nada (no error)-->
            <p class="error-message">{{ emailError() }}</p>
            }

            <label class="form-label">PASSWORD</label>
            <input class="input" type="password" placeholder="At least 6 characters" (input)="onPasswordInput($event)">
            @if(passwordTouched () && passwordError()){
            <!-- existe error y el ususario tocó el campo? -->
            <p class="error-message">{{ passwordError() }}</p>
            }
            
        </div>
        <button class="btn-primary" 
        (click)="onRegister()"
        [disabled]="loading() || !isFormValid()"
        >
        <!-- deshabilita botón si el formulario no es válido -->
            @if(loading()) {
                Creating account...
            } @else{
                Register
            }
        </button>

        <p class="form-footer">
            Already have an account?
            <a routerLink="/login">
                Login
            </a>
        </p>

        @if(error()) {
        <p class="error-message">
            {{ error() }}
        </p>
        }

        @if(success()) {
        <p class="success-message">
            {{ success() }}
        </p>
        }

    </div>
</div>
